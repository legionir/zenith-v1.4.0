<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zenith e2e fixture</title>
    <script type="importmap">
      {
  "imports": {
    "@zenith/state": "/packages/state/dist/index.js",
    "@zenith/scheduler": "/packages/scheduler/dist/index.js",
    "@zenith/errors": "/packages/errors/dist/index.js",
    "@zenith/logger": "/packages/logger/dist/index.js",
    "@zenith/shared": "/packages/shared/dist/index.js",
    "@zenith/a11y": "/packages/a11y/dist/index.js",
    "@zenith/head": "/packages/head/dist/index.js",
    "@zenith/ui": "/packages/ui/dist/index.js",
    "@zenith/expressions": "/packages/expressions/dist/index.js",
    "@zenith/schema": "/packages/schema/dist/index.js",
    "@zenith/jalali": "/packages/jalali/dist/index.js",
    "@zenith/transition": "/packages/transition/dist/index.js",
    "@zenith/http": "/packages/http/dist/index.js",
    "@zenith/resource": "/packages/resource/dist/index.js",
    "@zenith/mock": "/packages/mock/dist/index.js",
    "@zenith/ui/position": "/packages/ui/dist/position.js"
  }
}
    </script>
  </head>
  <body>
    <main id="app">
      <p id="counter">0</p>
      <button id="inc" type="button">+1</button>
      <p id="doubled">0</p>
    </main>
    <script type="module">
      import { signal, computed, effect } from '@zenith/state';
      import { installTestBridge } from '/packages/testing-e2e/dist/browser.js';

      const count = signal(0);
      const doubled = computed(() => count.get() * 2);

      // effect() runs synchronously on creation; updates flush via the
      // scheduler microtask queue — exactly what the e2e test drives.
      effect(() => {
        document.getElementById('counter').textContent = String(count.get());
      });
      effect(() => {
        document.getElementById('doubled').textContent = String(doubled.get());
      });

      document.getElementById('inc').addEventListener('click', () => count.update((c) => c + 1));
      window.__ZENITH_E2E_READY__ = true;
      installTestBridge({ signals: { count }, ready: () => window.__ZENITH_E2E_READY__ === true, snapshot: () => ({ count: count.get() }) });
    </script>
  </body>
</html>
