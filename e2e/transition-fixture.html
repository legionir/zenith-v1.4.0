<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zenith transition e2e fixture</title>
    <script type="importmap">
      {
  "imports": {
    "@zenith/transition": "/packages/transition/dist/index.js",
    "@zenith/errors": "/packages/errors/dist/index.js",
    "@zenith/logger": "/packages/logger/dist/index.js",
    "@zenith/shared": "/packages/shared/dist/index.js",
    "@zenith/a11y": "/packages/a11y/dist/index.js",
    "@zenith/head": "/packages/head/dist/index.js",
    "@zenith/ui": "/packages/ui/dist/index.js",
    "@zenith/expressions": "/packages/expressions/dist/index.js",
    "@zenith/schema": "/packages/schema/dist/index.js",
    "@zenith/jalali": "/packages/jalali/dist/index.js",
    "@zenith/http": "/packages/http/dist/index.js",
    "@zenith/resource": "/packages/resource/dist/index.js",
    "@zenith/mock": "/packages/mock/dist/index.js",
    "@zenith/ui/position": "/packages/ui/dist/position.js"
  }
}
    </script>
    <style>
      #two-props {
        transition-property: opacity, transform;
        transition-duration: 0.1s, 0.5s;
      }
      #child-anim > span {
        display: block;
        animation: spin 0.05s linear 1;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="two-props"><span class="inner">content</span></div>
    <div id="child-anim">
      <span class="inner">child animates</span>
    </div>

    <script type="module">
      import { createTransition } from '@zenith/transition';

      window.__ZENITH_TRN_READY__ = false;
      window.__ZENITH_TRN__ = { leaveCompleteAt: null, startedAt: null };

      const ctl = createTransition('fade', { duration: 50 });

      window.startLeave = (id) => {
        const el = document.getElementById(id);
        window.__ZENITH_TRN__.startedAt = performance.now();
        return ctl.leave(el).finished.then(() => {
          window.__ZENITH_TRN__.leaveCompleteAt = performance.now();
          window.__ZENITH_TRN__.classNameAtEnd = el.className;
        });
      };

      window.__ZENITH_TRN_READY__ = true;
    </script>
  </body>
</html>
