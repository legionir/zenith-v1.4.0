name: Release (npm OIDC + Provenance)

# #66: Publish exclusively from version tags via GitHub Actions OIDC
# (Trusted Publishing) with SLSA provenance attestation and zero long-lived
# token secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm with Provenance
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # Pinned OIDC-capable client; no setup-node auth token/.npmrc placeholder.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Publish packages in topological order with provenance
        run: node scripts/release.mjs --publish --provenance
