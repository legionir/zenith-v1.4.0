name: Release (npm OIDC + Provenance)

# #66: Publish exclusively from version tags via GitHub Actions OIDC
# (Trusted Publishing) with SLSA provenance attestation and zero long-lived
# token secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm with Provenance
    runs-on: ubuntu-latest
    environment: release
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish packages in topological order with provenance
        run: node scripts/release.mjs --publish --provenance
