<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه Zenith</title>
  <script type="importmap">
  {
    "imports": {
      "@zenith/actions": "/packages/actions/dist/index.js",
      "@zenith/auth": "/packages/auth/dist/index.js",
      "@zenith/cache": "/packages/cache/dist/index.js",
      "@zenith/components": "/packages/components/dist/index.js",
      "@zenith/data": "/packages/data/dist/index.js",
      "@zenith/devtools": "/packages/devtools/dist/index.js",
      "@zenith/error-boundary": "/packages/error-boundary/dist/index.js",
      "@zenith/errors": "/packages/errors/dist/index.js",
      "@zenith/events": "/packages/events/dist/index.js",
      "@zenith/expressions": "/packages/expressions/dist/index.js",
      "@zenith/http": "/packages/http/dist/index.js",
      "@zenith/jalali": "/packages/jalali/dist/index.js",
      "@zenith/logger": "/packages/logger/dist/index.js",
      "@zenith/notifications": "/packages/notifications/dist/index.js",
      "@zenith/resource": "/packages/resource/dist/index.js",
      "@zenith/router": "/packages/router/dist/index.js",
      "@zenith/runtime": "/packages/runtime/dist/index.js",
      "@zenith/scheduler": "/packages/scheduler/dist/index.js",
      "@zenith/security": "/packages/security/dist/index.js",
      "@zenith/shared": "/packages/shared/dist/index.js",
      "@zenith/state": "/packages/state/dist/index.js",
      "@zenith/storage": "/packages/storage/dist/index.js",
      "@zenith/store": "/packages/store/dist/index.js",
      "@zenith/suspense": "/packages/suspense/dist/index.js",
      "@zenith/transition": "/packages/transition/dist/index.js"
    }
  }
  </script>
  <script type="module" src="/ecommerce-demo/src/main.js"></script>
</head>
<body>
  <header>
    <h1 zen-text="$store.name">فروشگاه Zenith</h1>
    <nav>
      <a zen-link="/">صفحه اصلی</a>
      <a zen-link="/cart">سبد خرید</a>
    </nav>
  </header>

  <main>
    <section id="products">
      <h2>محصولات</h2>
      <div zen-resource="'/api/products'" zen-state="products">
        <div zen-if="$products.loading">در حال بارگذاری...</div>
        <div zen-if="$products.error">خطا: <span zen-text="$products.error"></span></div>
        <ul zen-for="product in $products.data" zen-key="product.id">
          <li>
            <h3 zen-text="$product.title"></h3>
            <p>قیمت: <span zen-text="$product.price"></span> تومان</p>
            <button zen-action="addToCart"
                    zen-bind:data-product-id="$product.id"
                    zen-bind:data-product-name="$product.title">افزودن</button>
          </li>
        </ul>
      </div>
    </section>

    <section id="cart">
      <h2>سبد خرید (<span zen-text="$store.cartCount.get()"></span>)</h2>
      <div zen-for="item in $store.state.cart" zen-key="item.id">
        <span zen-text="$item.title"></span>
        <button zen-action="removeFromCart" zen-bind:data-id="$item.id">حذف</button>
      </div>
      <button zen-action="checkout">ثبت سفارش</button>
      <p>وضعیت سفارش: <span zen-text="$store.state.lastOrderStatus"></span></p>
    </section>
  </main>
</body>
</html>
